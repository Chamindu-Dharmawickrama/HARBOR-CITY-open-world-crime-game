name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: typecheck · lint · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
        env:
          CI: 'true'
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
